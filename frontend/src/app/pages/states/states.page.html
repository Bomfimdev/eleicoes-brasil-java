@if (live.overview(); as o) {
  <header class="page-head">
    <h1>Estados</h1>
    <p class="sub">Totalização e líderes por UF</p>
  </header>

  <app-brazil-map [states]="o.states" [allowLeader]="!!o.headline" />

  <ul class="states">
    @for (s of o.states; track s.uf) {
      <li>
        <a [routerLink]="['/estado', s.uf]">
          <span class="uf">{{ s.uf }}</span>
          <span class="name">{{ s.name }}</span>
          <span class="pct">{{ fmtPct(s.progress?.countedPct ?? null, 1) }}</span>
        </a>
      </li>
    }
  </ul>
} @else if (live.loading()) {
  <p class="muted pad">Carregando…</p>
}
