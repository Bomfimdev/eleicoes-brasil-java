services:
  postgres:
    image: postgres:16-alpine
    container_name: eleicoes-postgres
    environment:
      POSTGRES_DB: eleicoes
      POSTGRES_USER: eleicoes
      POSTGRES_PASSWORD: eleicoes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eleicoes -d eleicoes"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eleicoes-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ""
      APP_MODE: DEVELOPMENT
      COLLECTOR_ENABLED: "true"
      COLLECTOR_IGNORE_WINDOWS: "true"
      CORS_ORIGINS: http://localhost:4200,http://localhost:8088
      DATABASE_URL: jdbc:postgresql://postgres:5432/eleicoes
      DATABASE_USERNAME: eleicoes_app
      DATABASE_PASSWORD: eleicoes_app
      DB_MIGRATION_USER: eleicoes_migrator
      DB_MIGRATION_PASSWORD: eleicoes_migrator
      DB_APP_USER: eleicoes_app
      DB_APP_PASSWORD: eleicoes_app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: eleicoes-frontend
    ports:
      - "8088:80"
    volumes:
      - ./frontend/dist/frontend/browser:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    profiles:
      - full

volumes:
  postgres-data:
