spring:
  application:
    name: eleicoes-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eleicoes}
    username: ${DB_USER:eleicoes}
    password: ${DB_PASSWORD:eleicoes}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

eleicoes:
  app-mode: ${APP_MODE:DEVELOPMENT}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
