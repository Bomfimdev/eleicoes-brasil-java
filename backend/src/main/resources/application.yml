spring:
  application:
    name: eleicoes-api
  datasource:
    # Ordem: SPRING_DATASOURCE_* (Render) → DATABASE_* (padrão Gabriel) → Docker local
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eleicoes}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${DB_APP_USER:eleicoes_app}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${DB_APP_PASSWORD:eleicoes_app}}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    user: ${SPRING_LIQUIBASE_USER:${DB_MIGRATION_USER:${DATABASE_USERNAME:eleicoes_migrator}}}
    password: ${SPRING_LIQUIBASE_PASSWORD:${DB_MIGRATION_PASSWORD:${DATABASE_PASSWORD:eleicoes_migrator}}}

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: false

eleicoes:
  app-mode: ${APP_MODE:DEVELOPMENT}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  election-windows: ${ELECTION_WINDOWS:2026-10-04T17:00-03:00/2026-10-05T22:00-03:00,2026-10-25T17:00-03:00/2026-10-26T22:00-03:00}
