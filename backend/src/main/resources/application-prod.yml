server:
  port: ${PORT:8080}

spring:
  jpa:
    show-sql: false
    open-in-view: false
  jmx:
    enabled: false

eleicoes:
  collector:
    # Em produção respeita ELECTION_WINDOWS (no-op fora da janela).
    ignore-windows: ${COLLECTOR_IGNORE_WINDOWS:false}

# Swagger fica disponível; docs em memória só sob demanda.
springdoc:
  swagger-ui:
    disable-swagger-default-url: true

logging:
  level:
    root: WARN
    br.dev.bomfim.eleicoes: INFO
    org.hibernate: WARN
    org.springframework: WARN
